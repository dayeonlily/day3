<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 관광지 AI 추천 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --accent:#0a7c66; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --fg:#eee; --muted:#aaa; --line:#333; --accent:#3fc7a8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,"Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 8px 0 0; }
  select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  body { display:flex; flex-direction:column; height:100vh; }
  #ask { padding:10px 16px; display:flex; gap:8px; border-bottom:1px solid var(--line); }
  #ask input { flex:1; font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  main { display:grid; grid-template-columns:340px 1fr; flex:1; min-height:0; }
  aside { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  #answer { display:none; max-height:55%; overflow:auto; padding:12px 16px; border-bottom:1px solid var(--line); font-size:14px; line-height:1.55; }
  #answer .steps { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  #answer .chip { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--accent); color:var(--accent); }
  #answer .text { white-space:pre-wrap; }
  #list { flex:1; overflow:auto; padding:8px 0; margin:0; list-style:none; }
  #list li { padding:8px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  #list li:hover { background:rgba(127,127,127,.12); }
  #list small { display:block; color:var(--muted); }
  #status { padding:8px 16px; color:var(--muted); font-size:14px; }
  #map { height:100%; }
  @media (max-width:700px) {
    body { height:auto; }
    main { grid-template-columns:1fr; flex:none; }
    aside { border-right:0; }
    #answer { max-height:none; }
    #list { overflow:visible; }
    #map { order:-1; height:320px; }
  }
</style>
</head>
<body>
<header>
  <h1>제주 관광지 지도</h1>
  <select id="area" aria-label="지역">
    <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
  </select>
  <select id="indoor" aria-label="실내 여부">
    <option value="">실내/야외 전체</option>
    <option value="true">실내</option>
    <option value="false">야외</option>
  </select>
  <button id="go">찾기</button>
</header>
<form id="ask">
  <input id="q" maxlength="300" placeholder="예) 내일 서쪽에서 가족이랑 갈만한 곳 추천해줘" aria-label="AI 추천 질문">
  <button id="askGo">AI 추천</button>
</form>
<main>
  <aside>
    <div id="answer" aria-live="polite"></div>
    <div id="status">지역을 고르고 찾기를 누르거나, 위에 질문을 입력하세요.</div>
    <ul id="list"></ul>
    <div style="padding:6px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)">날씨 데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color:inherit">Open-Meteo.com</a> (CC BY 4.0)</div>
  </aside>
  <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 원본 데이터에 좌표가 없어서, 장소 이름을 OpenStreetMap(Nominatim)으로 검색해 위치를 얻는다.
// 못 찾으면 지역 중심에 "대략 위치"로 표시한다.
const AREA_CENTER = {
  "동쪽": [33.45, 126.85], "서쪽": [33.37, 126.30],
  "서귀포": [33.25, 126.56], "제주시": [33.50, 126.53],
};
const JEJU_VIEWBOX = "126.10,33.60,127.00,33.10"; // left,top,right,bottom

const map = L.map("map").setView([33.38, 126.55], 10);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);
const layer = L.layerGroup().addTo(map);

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function cached(name) {
  try { return JSON.parse(localStorage.getItem("geo:" + name)); } catch { return undefined; }
}
function store(name, value) {
  try { localStorage.setItem("geo:" + name, JSON.stringify(value)); } catch {}
}

// 반환: [lat, lng] 또는 null. Nominatim 사용 정책상 요청 간격을 1초 이상 둔다.
async function geocode(name) {
  const hit = cached(name);
  if (hit !== undefined && hit !== null) return hit;
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1"
      + "&accept-language=ko&viewbox=" + JEJU_VIEWBOX + "&q=" + encodeURIComponent(name);
    const rows = await (await fetch(url)).json();
    const pos = rows.length ? [Number(rows[0].lat), Number(rows[0].lon)] : null;
    if (pos) store(name, pos);
    await sleep(1100);
    return pos;
  } catch {
    return null;
  }
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// 장소 목록을 지도와 목록에 표시한다. fallbackArea 는 좌표를 못 찾았을 때 쓸 지역 중심.
async function showSpots(spots, fallbackArea, onProgress) {
  $("list").innerHTML = "";
  layer.clearLayers();
  const bounds = [];
  for (const [i, s] of spots.entries()) {
    const found = await geocode(s.name);
    const center = AREA_CENTER[fallbackArea] || AREA_CENTER[s.region.split("(")[0]] || AREA_CENTER["제주시"];
    const pos = found || center.map((v, k) => v + (i % 3 - 1) * 0.01 * (k ? 1 : -1));
    const kind = s.indoor ? "실내" : "야외";
    const marker = L.marker(pos).addTo(layer).bindPopup(
      `<b>${esc(s.name)}</b><br>${esc(s.region)} · ${kind}<br>${esc(s.desc)}`
      + (found ? "" : "<br><i>대략 위치(정확한 좌표 없음)</i>"));
    bounds.push(pos);

    const li = document.createElement("li");
    li.innerHTML = `${esc(s.name)}<small>${esc(s.region)} · ${kind} · ${esc(s.desc)}${found ? "" : " · 대략 위치"}</small>`;
    li.onclick = () => { map.setView(pos, 13); marker.openPopup(); };
    $("list").appendChild(li);
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
    if (onProgress) onProgress(i + 1);
  }
}

async function search() {
  const area = $("area").value, indoor = $("indoor").value;
  $("go").disabled = true;
  $("answer").style.display = "none";
  $("list").innerHTML = "";
  layer.clearLayers();
  $("status").textContent = "장소 찾는 중…";
  try {
    const q = new URLSearchParams({ area });
    if (indoor) q.set("indoor", indoor);
    const res = await fetch("/api/spots?" + q);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "요청 실패");

    $("status").textContent = `전체 ${data.total}곳 중 ${data.spots.length}곳 표시 (위치 찾는 중…)`;
    await showSpots(data.spots, area);
    $("status").textContent = `전체 ${data.total}곳 중 ${data.spots.length}곳 표시`;
  } catch (e) {
    $("status").textContent = "오류: " + e.message;
  } finally {
    $("go").disabled = false;
  }
}
$("go").addEventListener("click", search);

// ---- AI 추천: 서버의 에이전트가 open_meteo · find_spots 를 스스로 골라 호출한다 ----
const TOOL_LABEL = {
  open_meteo: (i) => `🌤 날씨 확인 · ${i.area}${i.date ? " " + i.date : ""}`,
  find_spots: (i) => `📍 장소 검색 · ${i.area}${i.indoor === undefined ? "" : i.indoor ? " · 실내" : " · 야외"}`,
};

async function ask(e) {
  e.preventDefault();
  const message = $("q").value.trim();
  if (!message) return;
  $("askGo").disabled = true;
  const box = $("answer");
  box.style.display = "block";
  box.innerHTML = '<div class="text">AI가 날씨와 장소를 확인하는 중…</div>';
  $("list").innerHTML = "";
  layer.clearLayers();
  $("status").textContent = "";
  try {
    const res = await fetch("/api/agent", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message }),
    });
    // 서버가 JSON 이 아닌 오류 페이지(시간 초과 · 함수 충돌 등)를 돌려줄 때도 원인이 보이도록 본문을 먼저 읽는다.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch {
      throw new Error(`서버 오류(HTTP ${res.status}): ${raw.slice(0, 200)}`);
    }
    if (!res.ok) throw new Error(data.error || "요청 실패");

    const chips = data.steps.map((s) => `<span class="chip">${esc((TOOL_LABEL[s.tool] || (() => s.tool))(s.input))}</span>`).join("");
    box.innerHTML = `<div class="steps">${chips}</div><div class="text">${esc(data.answer)}</div>`;

    // 답변에 언급된 장소만 지도에 올린다(없으면 검색된 전체).
    const found = data.steps.filter((s) => s.tool === "find_spots" && s.result.spots).flatMap((s) => s.result.spots);
    const unique = [...new Map(found.map((s) => [s.name, s])).values()];
    const mentioned = unique.filter((s) => data.answer.includes(s.name));
    const spots = mentioned.length ? mentioned : unique;
    if (spots.length) {
      $("status").textContent = `추천 장소 ${spots.length}곳 (위치 찾는 중…)`;
      await showSpots(spots, null);
      $("status").textContent = `추천 장소 ${spots.length}곳 표시`;
    }
  } catch (err) {
    box.innerHTML = `<div class="text">오류: ${esc(err.message)}</div>`;
  } finally {
    $("askGo").disabled = false;
  }
}
$("ask").addEventListener("submit", ask);
</script>
</body>
</html>
