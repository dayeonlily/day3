<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISS 실시간 추적</title>
<style>
  :root { --fg:#e8f0ff; --muted:#8fa3c7; --accent:#ffd34d; --panel:rgba(8,14,30,.72); --line:rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:var(--fg); font-family:system-ui,"Malgun Gothic",sans-serif; overflow:hidden; }
  #globe { position:fixed; inset:0; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; backdrop-filter:blur(8px); }
  #info { top:16px; left:16px; width:280px; }
  h1 { font-size:16px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#3ddc84; box-shadow:0 0 8px #3ddc84; animation:pulse 1.4s infinite; }
  .dot.err { background:#ff5a5a; box-shadow:0 0 8px #ff5a5a; animation:none; }
  @keyframes pulse { 50% { opacity:.3; } }
  .country { font-size:22px; font-weight:700; color:var(--accent); margin:2px 0 10px; min-height:30px; }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; font-variant-numeric:tabular-nums; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; }
  #controls { bottom:16px; left:16px; display:flex; gap:8px; }
  button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }
  button[aria-pressed="true"] { background:var(--accent); color:#111; border-color:var(--accent); }
  #credit { position:fixed; right:12px; bottom:8px; font-size:11px; color:var(--muted); }
  @media (max-width:600px) { #info { width:calc(100% - 32px); } #controls { bottom:36px; } }
</style>
</head>
<body>
<div id="globe"></div>

<div class="panel" id="info">
  <h1><span class="dot" id="dot"></span>ISS 실시간 위치</h1>
  <div class="country" id="country">위치 확인 중…</div>
  <dl>
    <dt>위도</dt><dd id="lat">–</dd>
    <dt>경도</dt><dd id="lon">–</dd>
    <dt>고도</dt><dd id="alt">–</dd>
    <dt>속도</dt><dd id="vel">–</dd>
    <dt>일조</dt><dd id="vis">–</dd>
    <dt>현지 시간대</dt><dd id="tz">–</dd>
  </dl>
</div>

<div class="panel" id="controls">
  <button id="follow" aria-pressed="true">ISS 따라가기</button>
  <button id="orbit" aria-pressed="true">궤도 표시</button>
</div>
<div id="credit">데이터: wheretheiss.at · 키 없이 동작</div>

<script src="https://unpkg.com/globe.gl@2.33.1/dist/globe.gl.min.js"></script>
<script>
const API = 'https://api.wheretheiss.at/v1';
const ID = 25544;
const $ = id => document.getElementById(id);
const regionNames = new Intl.DisplayNames(['ko'], { type: 'region' });

let trail = [];          // 실제 지나온 위치
let pastOrbit = [], futureOrbit = [];
let current = null;
let follow = true, showOrbit = true;

const globe = Globe()($('globe'))
  .globeImageUrl('https://unpkg.com/three-globe@2.31.1/example/img/earth-blue-marble.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe@2.31.1/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe@2.31.1/example/img/night-sky.png')
  .atmosphereColor('#6aa8ff').atmosphereAltitude(0.2)
  .pathPointLat(p => p[0]).pathPointLng(p => p[1]).pathPointAlt(0.06)
  .pathColor(p => p.color).pathStroke(1.4).pathTransitionDuration(0)
  .ringLat(d => d.lat).ringLng(d => d.lng)
  .ringColor(() => t => `rgba(255,211,77,${1 - t})`)
  .ringMaxRadius(6).ringPropagationSpeed(3).ringRepeatPeriod(1200)
  .htmlElementsData([]).htmlLat(d => d.lat).htmlLng(d => d.lng).htmlAltitude(0.06)
  .htmlElement(() => {
    const el = document.createElement('div');
    el.textContent = '🛰️';
    el.style.cssText = 'font-size:30px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 8px #ffd34d);pointer-events:none';
    return el;
  });
globe.controls().autoRotate = false;
globe.pointOfView({ lat: 20, lng: 0, altitude: 2.4 });
addEventListener('resize', () => globe.width(innerWidth).height(innerHeight));

// 날짜변경선을 넘는 구간은 선이 지구를 가로지르지 않도록 쪼갠다
function toPaths(points, color) {
  const paths = []; let cur = [];
  for (const p of points) {
    if (cur.length && Math.abs(p[1] - cur[cur.length - 1][1]) > 180) { paths.push({ pts: cur, color }); cur = []; }
    cur.push(p);
  }
  if (cur.length) paths.push({ pts: cur, color });
  return paths;
}
function drawPaths() {
  const paths = showOrbit
    ? [...toPaths(pastOrbit.concat(trail), 'rgba(255,211,77,.95)'), ...toPaths(futureOrbit, 'rgba(120,200,255,.55)')]
    : [];
  globe.pathsData(paths).pathPoints('pts');
}

async function loadOrbit() {
  const now = Math.floor(Date.now() / 1000), step = 300;
  const ts = (from, n) => Array.from({ length: n }, (_, i) => from + i * step);
  const get = async arr => {
    const r = await fetch(`${API}/satellites/${ID}/positions?timestamps=${arr.join(',')}`);
    return (await r.json()).map(p => [p.latitude, p.longitude]);
  };
  try {
    const [past, f1, f2, f3] = await Promise.all([
      get(ts(now - 10 * step, 10)), get(ts(now, 10)), get(ts(now + 10 * step, 10)), get(ts(now + 20 * step, 10)),
    ]);
    pastOrbit = past; futureOrbit = [...f1, ...f2, ...f3];
    drawPaths();
  } catch (e) { console.warn('궤도 로드 실패', e); }
}

let lastGeo = 0;
async function updateCountry(lat, lng) {
  if (Date.now() - lastGeo < 8000) return;
  lastGeo = Date.now();
  try {
    const r = await fetch(`${API}/coordinates/${lat},${lng}`);
    const c = await r.json();
    $('tz').textContent = c.timezone_id && c.timezone_id !== '?' ? c.timezone_id : '–';
    if (c.country_code && c.country_code !== '??') {
      const flag = [...c.country_code].map(ch => String.fromCodePoint(127397 + ch.charCodeAt(0))).join('');
      $('country').textContent = `${flag} ${regionNames.of(c.country_code)}`;
    } else {
      $('country').textContent = '🌊 바다 위';
    }
  } catch { /* 다음 주기에 재시도 */ }
}

async function tick() {
  try {
    const r = await fetch(`${API}/satellites/${ID}`);
    const d = await r.json();
    current = { lat: d.latitude, lng: d.longitude };
    $('dot').classList.remove('err');
    $('lat').textContent = d.latitude.toFixed(3) + '°';
    $('lon').textContent = d.longitude.toFixed(3) + '°';
    $('alt').textContent = d.altitude.toFixed(1) + ' km';
    $('vel').textContent = Math.round(d.velocity).toLocaleString() + ' km/h';
    $('vis').textContent = d.visibility === 'daylight' ? '☀️ 낮' : d.visibility === 'eclipsed' ? '🌙 밤' : '🌅 박명';
    trail.push([d.latitude, d.longitude]);
    if (trail.length > 400) trail.shift();
    globe.htmlElementsData([current]).ringsData([current]);
    drawPaths();
    if (follow) globe.pointOfView({ lat: d.latitude, lng: d.longitude }, 1500);
    updateCountry(d.latitude, d.longitude);
  } catch {
    $('dot').classList.add('err');
  }
}

$('follow').onclick = e => { follow = !follow; e.target.setAttribute('aria-pressed', follow); };
$('orbit').onclick = e => { showOrbit = !showOrbit; e.target.setAttribute('aria-pressed', showOrbit); drawPaths(); };
globe.controls().addEventListener('start', () => { follow = false; $('follow').setAttribute('aria-pressed', false); });

loadOrbit();
setInterval(loadOrbit, 10 * 60 * 1000);
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
